<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reports & Audits – LABORA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">L</div>
        <div class="brand-text">
          <h1>LABORA</h1>
          <span>Campus Asset System</span>
        </div>
      </div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="equipment.html" class="nav-link">Equipment Catalog</a></li>
        <li><a href="issue.html" class="nav-link">Issue & Returns</a></li>
        <li><a href="users.html" class="nav-link">User Management</a></li>
        <li><a href="reports.html" class="nav-link active">Reports & Audits</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-profile-summary">
          <div class="avatar-initials" id="sidebar-initials">AD</div>
          <div>
            <div class="user-meta-name" id="sidebar-user-name">User</div>
            <div class="user-meta-role" id="sidebar-user-role">Role</div>
          </div>
        </div>
        <button id="logout-btn" class="btn-logout">✕</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="page-title">
          <h2>Reports & Governance Audit Logs</h2>
          <p>Export official university audit statements, checkout histories, and equipment status logs.</p>
        </div>
        <div style="display: flex; gap: 12px;">
          <button class="btn btn-outline" id="btn-export-csv">⬇ Export CSV</button>
          <button class="btn btn-primary" id="btn-print-report">🖨 Print Report</button>
        </div>
      </header>

      <div class="card-panel" style="padding: 16px 24px; margin-bottom: 20px;">
        <div style="max-width: 320px;">
          <label style="font-size:0.82rem; font-weight:600; margin-bottom: 6px; display: block;">Select Audit Dimension</label>
          <select id="report-type-select" class="select-control">
            <option value="inventory">Equipment Inventory Valuation & Status</option>
            <option value="history">Historical Issue & Return Transactions</option>
            <option value="users">Student & Faculty Borrowing Aggregation</option>
          </select>
        </div>
      </div>

      <section class="card-panel">
        <div class="table-responsive">
          <table class="data-table">
            <thead id="report-table-head"></thead>
            <tbody id="report-table-body">
              <tr><td colspan="6" style="text-align: center;">Loading report...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
